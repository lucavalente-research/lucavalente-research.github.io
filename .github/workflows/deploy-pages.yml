name: Deploy Valen Terminal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public terminal
        run: |
          mkdir -p _site/assets _site/css _site/js _site/immagini
          cp index.html portfolio.html CNAME robots.txt sitemap.xml _site/
          cp css/mostro_terminal.css css/macro_desk_v9.css _site/css/
          cp js/mostro_engine_core.js js/macro_desk_v9.js _site/js/
          cp assets/terminal-v6.js assets/terminal-v6.json _site/assets/
          cp -R assets/token-logos assets/research-v6 assets/video-v6 assets/macro-v9 _site/assets/
          mkdir -p _site/immagini/analysis
          cp immagini/analysis/analysis-2026-10-18-liquidity-thermometer.png immagini/analysis/analysis-2026-10-18-token-supply-concentration.png _site/immagini/analysis/
          cp immagini/og.png _site/immagini/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
