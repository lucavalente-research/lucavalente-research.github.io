name: Deploy Valen Terminal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public terminal
        run: |
          mkdir -p _site/data _site/immagini
          cp index.html portfolio.html CNAME robots.txt sitemap.xml stile.css _site/
          cp -R assets css js _site/
          cp data/mostro_data_bundle.json data/mostro_data_bundle.js _site/data/
          cp -R immagini/analysis _site/immagini/
          cp immagini/og.png _site/immagini/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
